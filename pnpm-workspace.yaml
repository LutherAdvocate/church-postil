# pnpm-workspace.yaml
nodeLinker: hoisted
shamefullyHoist: true

packages:
  - '.'

publicHoistPattern:
  - '*unhead*'
  - '*@unhead*'
  - '*@tanstack/vue-table*' # Exposes the Vue components
  - '*@tanstack/table-core*' # CRUCIAL: Exposes the core engine and SortFn types
  
  - 'types.*'
  - 'eslint.*'

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
